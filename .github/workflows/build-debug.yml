name: Build Debug APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download latest music source
        run: |
          echo "Finding latest music source JS file..."
          # 列出仓库根目录下的所有文件，找到第一个 .js 文件
          JS_FILE=$(curl -s "https://api.github.com/repos/luanmuc/lx-music-source/contents/" | python3 -c "import json,sys; files=json.load(sys.stdin); js_files=[f['name'] for f in files if f['name'].endswith('.js')]; print(js_files[0] if js_files else '')")
          if [ -z "$JS_FILE" ]; then
            echo "Warning: No JS file found in source repo, using fallback"
            exit 0
          fi
          echo "Found source file: $JS_FILE"
          # URL 编码文件名
          ENCODED_NAME=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$JS_FILE'))")
          curl -sL "https://raw.githubusercontent.com/luanmuc/lx-music-source/master/$ENCODED_NAME" -o android/app/src/main/assets/builtin_source.js
          echo "Downloaded music source:"
          ls -lh android/app/src/main/assets/builtin_source.js
          head -5 android/app/src/main/assets/builtin_source.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Setup Android
        uses: ./.github/actions/setup

      - name: Build Debug APK
        env:
          DISABLE_SVG: 1
        shell: bash
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          cd android/app/build/outputs/apk/debug
          mv app-debug.apk lx-music-mobile-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/lx-music-mobile-debug.apk
