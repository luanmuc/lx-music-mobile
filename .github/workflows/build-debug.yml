name: Build Debug APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download latest music source
        run: |
          echo "Downloading latest music source (lx-source.js)..."
          # 固定文件名 lx-source.js（音源仓库根目录始终为最新版），无需 contents API 列举与 URL 编码；
          # 使用 GITHUB_TOKEN 认证避免未认证 API 限流(60次/小时)导致静默失败
          curl -sL -H "Authorization: Bearer ${{ github.token }}" \
            "https://raw.githubusercontent.com/luanmuc/lx-music-source/master/lx-source.js" \
            -o android/app/src/main/assets/builtin_source.js
          echo "Downloaded music source:"
          ls -lh android/app/src/main/assets/builtin_source.js
          head -5 android/app/src/main/assets/builtin_source.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Setup Android
        uses: ./.github/actions/setup

      - name: Build Debug APK
        env:
          DISABLE_SVG: 1
        shell: bash
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luanmuc-lxmusic-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
