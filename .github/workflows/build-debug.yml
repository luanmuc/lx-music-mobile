name: Build Debug APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download latest music source
        run: |
          echo "Downloading latest music source (lx-source.js)..."
          # -f: HTTP 4xx/5xx 即失败退出，避免静默写入错误页导致内置源损坏
          curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            "https://raw.githubusercontent.com/luanmuc/lx-music-source/master/lx-source.js" \
            -o android/app/src/main/assets/builtin_source.js
          # 内容校验：必须为有效的洛雪音源（含 @name 标记）
          head -1 android/app/src/main/assets/builtin_source.js | grep -q "@name" || { echo "音源文件异常"; exit 1; }
          echo "Downloaded music source:"
          ls -lh android/app/src/main/assets/builtin_source.js
          head -2 android/app/src/main/assets/builtin_source.js

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Build Debug APK
        env:
          DISABLE_SVG: 1
        shell: bash
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luanmuc-lxmusic-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
