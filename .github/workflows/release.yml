name: Build

on:
  push:
    branches:
      - master

# 仓库默认 GITHUB_TOKEN 为只读：下载 artifact 需 actions:read，创建 Release 需 contents:write
permissions:
  contents: write
  actions: read

jobs:
  Android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Download latest music source
        run: |
          echo "Downloading latest music source (lx-source.js)..."
          curl -sL -H "Authorization: Bearer ${{ github.token }}" \
            "https://raw.githubusercontent.com/luanmuc/lx-music-source/master/lx-source.js" \
            -o android/app/src/main/assets/builtin_source.js
          ls -lh android/app/src/main/assets/builtin_source.js
          head -5 android/app/src/main/assets/builtin_source.js

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Build Debug APK
        env:
          DISABLE_SVG: 1
        shell: bash
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luanmuc-lxmusic-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

