name: Build

on:
  push:
    branches:
      - master
    # 排除 publish 目录：CI 自动提交版本信息文件时不触发新的构建（防循环）
    paths-ignore:
      - 'publish/**'
  workflow_dispatch: {}

# 仓库默认 GITHUB_TOKEN 为只读：下载 artifact 需 actions:read，创建 Release 需 contents:write
permissions:
  contents: write
  actions: read

jobs:
  Android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Download latest music source
        run: |
          echo "Downloading latest music source (lx-source.js)..."
          # -f: HTTP 4xx/5xx 即失败退出，避免静默写入错误页导致内置源损坏
          curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            "https://raw.githubusercontent.com/luanmuc/lx-music-source/master/lx-source.js" \
            -o android/app/src/main/assets/builtin_source.js
          # 内容校验：文件须大于50KB且含 @name 标记（第一行为 /*! 注释符，取前5行匹配）
          [ "$(stat -c%s android/app/src/main/assets/builtin_source.js)" -gt 50000 ] || { echo "音源文件过小"; exit 1; }
          head -5 android/app/src/main/assets/builtin_source.js | grep -q "@name" || { echo "音源文件异常"; exit 1; }
          ls -lh android/app/src/main/assets/builtin_source.js
          head -2 android/app/src/main/assets/builtin_source.js

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Build Release APK
        env:
          DISABLE_SVG: 1
        shell: bash
        run: |
          cd android
          # release 变体自动打包 JS bundle（debug 变体不含 bundle，安装后无法独立运行）；
          # 无 secrets 时签名自动降级为 debug.keystore（build.gradle 已配置），可正常安装
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luanmuc-lxmusic-release
          # build.gradle 按 ABI 拆分输出：lx-music-mobile-vX.Y.Z-{arm64-v8a,armeabi-v7a,x86_64,x86,universal}.apk
          path: android/app/build/outputs/apk/release/*.apk

  Release:
    name: Release
    runs-on: ubuntu-latest
    needs: [Android]
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List Artifacts
        run: |
          echo "Artifacts:"; ls -la artifacts/

      - name: Generate file MD5
        run: |
          # 覆盖写入（>），避免重复构建时 Release 说明累积旧 MD5
          echo -e '### 更新内容\n\n- 内置豆包定制聚合音源（lx-source.js 最新版）\n' > ./publish/changeLog.md
          echo -e '\n### File MD5\n```' >> ./publish/changeLog.md
          cd artifacts
          md5sum *.apk >> ../publish/changeLog.md
          echo -e '```\n' >> ../publish/changeLog.md
          echo -e '\n[软件安装包说明](https://lyswhut.github.io/lx-music-doc/download#%E8%BD%AF%E4%BB%B6%E5%AE%89%E8%A3%85%E5%8C%85%E8%AF%B4%E6%98%8E)\n' >> ../publish/changeLog.md

      - name: Get package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "RUN_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ./publish/changeLog.md
          prerelease: true
          draft: false
          # 每次构建唯一 tag（版本号+构建序号），避免同一版本重复构建时 tag 冲突
          tag_name: v${{ env.PACKAGE_VERSION }}-b${{ env.RUN_NUMBER }}
          files: |
            artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update publish version.json
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          RUN_NUMBER=${{ github.run_number }}
          VER="${PACKAGE_VERSION}-b${RUN_NUMBER}"
          python3 - <<'PYEOF'
import json, os
old = {}
try:
    with open('publish/version.json', encoding='utf-8') as f:
        old = json.load(f)
except Exception:
    old = {}

# 更新内容段（changeLog.md 中 ### 更新内容 到 ### File MD5 之间的部分）
desc = ''
try:
    lines = open('publish/changeLog.md', encoding='utf-8').read().splitlines()
    capture = False
    parts = []
    for line in lines:
        if line.strip() == '### 更新内容':
            capture = True
            continue
        if line.strip() == '### File MD5':
            break
        if capture and line.strip():
            parts.append(line.strip())
    desc = '\n'.join(parts)
except Exception:
    pass

# 累积历史（保留最近 6 条，新版本在前）
history = old.get('history', []) if isinstance(old.get('history', []), list) else []
if old.get('version') and old.get('version') != VER:
    history = [{'version': old['version'], 'desc': old.get('desc', '')}] + history
history = history[:6]

data = {
    'version': VER,
    'desc': desc,
    'history': history,
}
with open('publish/version.json', 'w', encoding='utf-8') as f:
    json.dump(data, f, ensure_ascii=False, indent=2)
print('version.json ->', json.dumps(data, ensure_ascii=False))
PYEOF

      - name: Commit version.json
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          VER="${PACKAGE_VERSION}-b${{ github.run_number }}"
          git config user.name "luanmuc"
          git config user.email "luanmuc@users.noreply.github.com"
          git add publish/version.json
          git commit -m "chore: 更新版本信息 v${VER}" || echo "无改动，跳过提交"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master || echo "推送失败（后续发布不影响已完成的 Release）"
