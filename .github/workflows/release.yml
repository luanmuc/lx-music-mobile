name: Build

on:
  push:
    branches:
      - master
    # 排除 publish 目录：CI 自动提交版本信息文件时不触发新的构建（防循环）
    paths-ignore:
      - 'publish/**'
  workflow_dispatch: {}

# 仓库默认 GITHUB_TOKEN 为只读：下载 artifact 需 actions:read，创建 Release 需 contents:write
permissions:
  contents: write
  actions: read

jobs:
  Android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Download latest music source
        run: |
          echo "Downloading latest music source (lx-source.js)..."
          # 使用 GitHub Contents API（Accept: raw）获取音源仓库 master 最新内容，
          # 绕过 raw.githubusercontent.com 的 CDN 缓存，确保每次编译都拉到最新提交
          curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/luanmuc/lx-music-source/contents/lx-source.js" \
            -o android/app/src/main/assets/builtin_source.js
          # 内容校验：文件须大于50KB且含 @name 标记（第一行为 /*! 注释符，取前5行匹配）
          [ "$(stat -c%s android/app/src/main/assets/builtin_source.js)" -gt 50000 ] || { echo "音源文件过小"; exit 1; }
          head -5 android/app/src/main/assets/builtin_source.js | grep -q "@name" || { echo "音源文件异常"; exit 1; }
          ls -lh android/app/src/main/assets/builtin_source.js
          # 输出音源版本行（便于每次构建核对是否已拉到最新版）
          grep -o "豆包定制聚合音源 v[0-9.]*" android/app/src/main/assets/builtin_source.js | head -1
          head -2 android/app/src/main/assets/builtin_source.js

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Build Release APK
        env:
          DISABLE_SVG: 1
        shell: bash
        run: |
          # 每次构建注入唯一版本标识：versionName=1.9.1-b<run>、versionCode 递增
          # （build.gradle 支持 env 覆盖，package.json 保持 1.9.1 不变以维持 release tag 逻辑）
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          export APP_VERSION_NAME="${PACKAGE_VERSION}-b${GITHUB_RUN_NUMBER}"
          export APP_VERSION_CODE=$((80 + GITHUB_RUN_NUMBER))
          echo "export const buildNumber = 'b${GITHUB_RUN_NUMBER}'" > src/config/buildNumber.ts
          echo "构建版本: ${APP_VERSION_NAME} (versionCode ${APP_VERSION_CODE})"
          cd android
          # release 变体自动打包 JS bundle（debug 变体不含 bundle，安装后无法独立运行）；
          # 无 secrets 时签名自动降级为 debug.keystore（build.gradle 已配置），可正常安装
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: luanmuc-lxmusic-release
          # build.gradle 按 ABI 拆分输出：lx-music-mobile-vX.Y.Z-{arm64-v8a,armeabi-v7a,x86_64,x86,universal}.apk
          path: android/app/build/outputs/apk/release/*.apk

  Release:
    name: Release
    runs-on: ubuntu-latest
    needs: [Android]
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List Artifacts
        run: |
          echo "Artifacts:"; ls -la artifacts/

      - name: Generate file MD5
        run: |
          # 覆盖写入（>），避免重复构建时 Release 说明累积旧 MD5；
          # 该段同时是 App「软件更新」与 version.json 展示的更新日志，改版时同步更新
          echo -e '### 更新内容

本次基于洛雪音乐原版 v1.9.1 重建定制版，按「42项序号表」一次性合并 28 项功能（首批 b1）。

**下载（序号1/2/3/18）**
- 新增完整下载管理器：并行下载、暂停/恢复、失败自动重试、仅 WiFi 下载、自定义下载目录
- 歌曲列表/音质弹窗直接下载，下载完成通知
- 扫描本地下载目录并导入已下载歌曲

**音源（序号4）**
- 内置豆包定制聚合音源（CI 构建时自动拉取最新版）
- 自定义音源入口

**播放体验（序号6/7/12）**
- 通知栏显示当前歌词 + 桌面歌词开关按钮
- 听歌统计、定时关闭

**界面与设置（序号14/17/19/22/33）**
- 设置页改版：竖屏按类型分组，点击进入再展开
- 独立「清理缓存」页：一键/分项清理
- 底部导航新增「下载」页 + 首页排行榜
- 协议弹窗、设置迁移

**系统与构建（序号23/24/26-32/35-38/40）**
- 共存包（与应用商店版共存）、图标全套
- 在线更新增强、启动自动更新、版本多源检查、屏蔽电池优化、DeepLink 容错、构建版本号
- 权限三段式引导
- CI 重构、npm 版本信息发布、发布记录与仓库文档
' > ./publish/changeLog.md
          echo -e '\n### File MD5\n```' >> ./publish/changeLog.md
          cd artifacts
          md5sum *.apk >> ../publish/changeLog.md
          echo -e '```\n' >> ../publish/changeLog.md
          echo -e '\n[软件安装包说明](https://lyswhut.github.io/lx-music-doc/download#%E8%BD%AF%E4%BB%B6%E5%AE%89%E8%A3%85%E5%8C%85%E8%AF%B4%E6%98%8E)\n' >> ../publish/changeLog.md

      - name: Get package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "RUN_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ./publish/changeLog.md
          prerelease: true
          draft: false
          # 每次构建唯一 tag（版本号+构建序号），避免同一版本重复构建时 tag 冲突
          tag_name: v${{ env.PACKAGE_VERSION }}-b${{ env.RUN_NUMBER }}
          files: |
            artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update publish version.json
        env:
          # 不带 v 前缀：App 下载时拼 release tag 用（releases/download/v${version}）
          LX_VER: ${{ env.PACKAGE_VERSION }}-b${{ env.RUN_NUMBER }}
        run: |
          python3 scripts/update_version_info.py

      - name: Commit version.json
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          VER="${PACKAGE_VERSION}-b${{ github.run_number }}"
          git config user.name "luanmuc"
          git config user.email "luanmuc@users.noreply.github.com"
          git add publish/version.json
          git commit -m "chore: 更新版本信息 v${VER}" || echo "无改动，跳过提交"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master || echo "推送失败（后续发布不影响已完成的 Release）"

      - name: Publish npm version info
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          python3 scripts/publish_npm_info.py
