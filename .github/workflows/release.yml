  Release:
    name: Release
    runs-on: ubuntu-latest
    # needs: [Android, Android_SL]
    needs: [Android]
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Rename APK
        run: |
          echo "Artifacts:"; ls -la artifacts/
          # 构建产物为单个 app-debug.apk（非官方分ABI多包），统一重命名为可读名再发布
          mv artifacts/app-debug.apk artifacts/lx-music-mobile-debug.apk
          ls -la artifacts/

      - name: Generate file MD5
        run: |
          echo -e '\n### File MD5\n```' >> ./publish/changeLog.md
          cd artifacts
          md5sum *.apk >> ../publish/changeLog.md
          echo -e '```\n' >> ../publish/changeLog.md
          echo -e '\n[软件安装包说明](https://lyswhut.github.io/lx-music-doc/download#%E8%BD%AF%E4%BB%B6%E5%AE%89%E8%A3%85%E5%8C%85%E8%AF%B4%E6%98%8E)\n' >> ../publish/changeLog.md

      - name: Get package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "RUN_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ./publish/changeLog.md
          prerelease: true
          draft: false
          # 每次构建唯一 tag（版本号+构建序号），避免同一版本重复构建时 tag 冲突
          tag_name: v${{ env.PACKAGE_VERSION }}-b${{ env.RUN_NUMBER }}
          files: |
            artifacts/lx-music-mobile-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
